name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v2

      - name: Install SDK components (platform 28 + build-tools 30.0.2)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-28" "build-tools;30.0.2" "platform-tools"

      - name: Install NDK r17c
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r17c-linux-x86_64.zip
          unzip -q android-ndk-r17c-linux-x86_64.zip
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "ndk.dir=$GITHUB_WORKSPACE/android-ndk-r17c" >> local.properties

      # sdkmanager 需要 JDK 17+，构建需 JDK 8，故 SDK 装完后才切换 JDK
      - name: Set up JDK 8 for build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: virtualapp-apk
          path: |
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
